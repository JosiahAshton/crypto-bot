name: probe-apis

# Throwaway diagnostic. Binance returns 451 (geo-blocked) from GitHub's US
# runners, so this asks every candidate venue the same question from the same
# machine the bot actually runs on, instead of guessing which one is reachable.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Where is this runner
        run: curl -s https://ipinfo.io/json || true

      - name: Try every candidate market-data source
        run: |
          probe() {
            code=$(curl -s -o /tmp/body -w '%{http_code}' --max-time 20 "$2")
            printf '%-22s %s  %s\n' "$1" "$code" "$(head -c 110 /tmp/body | tr -d '\n')"
          }
          echo "=== GET endpoints ==="
          probe binance-futures "https://fapi.binance.com/fapi/v1/klines?symbol=BTCUSDT&interval=1h&limit=3"
          probe binance-spot    "https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=1h&limit=3"
          probe bybit-linear    "https://api.bybit.com/v5/market/kline?category=linear&symbol=BTCUSDT&interval=60&limit=3"
          probe bybit-funding   "https://api.bybit.com/v5/market/funding/history?category=linear&symbol=BTCUSDT&limit=3"
          probe okx-swap        "https://www.okx.com/api/v5/market/candles?instId=BTC-USDT-SWAP&bar=1H&limit=3"
          probe gate-futures    "https://api.gateio.ws/api/v4/futures/usdt/candlesticks?contract=BTC_USDT&interval=1h&limit=3"
          probe mexc-futures    "https://contract.mexc.com/api/v1/contract/kline/BTC_USDT?interval=Min60"
          probe kraken-futures  "https://futures.kraken.com/api/charts/v1/trade/PF_XBTUSD/1h?from=1750000000"
          probe coinbase-spot   "https://api.exchange.coinbase.com/products/BTC-USD/candles?granularity=3600"
          probe coingecko       "https://api.coingecko.com/api/v3/ping"

          echo ""
          echo "=== Hyperliquid (POST) ==="
          code=$(curl -s -o /tmp/hl -w '%{http_code}' --max-time 20 \
            -X POST https://api.hyperliquid.xyz/info \
            -H 'Content-Type: application/json' \
            -d '{"type":"metaAndAssetCtxs"}')
          printf '%-22s %s  %s\n' "hyperliquid" "$code" "$(head -c 110 /tmp/hl | tr -d '\n')"
